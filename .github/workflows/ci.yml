name: ci

on:
  push:
  workflow_dispatch:
    
jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5
      - name: setup
        uses: actions/setup-dotnet@v6
      - name: restore
        run: dotnet restore
      - name: build
        run: dotnet build --configuration Release --no-restore
      - name: test
        run: dotnet test --configuration Release --no-build 
